<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NeoPaw Studio</title>
<meta name="description" content="NeoPaw Studio — studio game indie dari Indonesia, pembuat Warung Life Simulator.">
<style>
  :root { --bg:#fffaf3; --fg:#2b2118; --muted:#6b5b4d; --accent:#d9480f; --card:#ffffff; --line:#eadfd2; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#1b1612; --fg:#f3ebe2; --muted:#b9a896; --accent:#ff8a4c; --card:#251e18; --line:#3a2f26; }
  }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); font:16px/1.6 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; }
  main { max-width:720px; margin:0 auto; padding:48px 16px 64px; }
  h1 { font-size:2rem; margin:0 0 4px; }
  .tag { color:var(--muted); margin:0 0 40px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:24px; margin-bottom:24px; }
  .card h2 { margin:0 0 8px; font-size:1.3rem; }
  a { color:var(--accent); }
  .btn { display:inline-block; margin-top:12px; padding:10px 18px; border-radius:10px; background:var(--accent); color:#fff; text-decoration:none; font-weight:600; }
  footer { color:var(--muted); font-size:.9rem; border-top:1px solid var(--line); padding-top:20px; }
  footer a { margin-right:16px; }
</style>
</head>
<body>
<main>
  <h1>NeoPaw Studio</h1>
  <p class="tag">Studio game indie dari Indonesia.</p>

  <section class="card">
    <h2>Warung Life Simulator</h2>
    <p>Jaga warung Pak Misran 24 jam: tata etalase, layani pembeli, bayar sewa, dan kenali warga sekitar. Game simulasi warung untuk Android.</p>
    <a class="btn" href="https://play.google.com/store/apps/details?id=com.neopawstudio.warunglife">Lihat di Google Play</a>
  </section>

  <footer>
    <p><a href="privasi.html">Kebijakan Privasi</a><a href="mailto:neopawstudio@gmail.com">neopawstudio@gmail.com</a></p>
    <p>&copy; 2026 NeoPaw Studio</p>
  </footer>
</main>
</body>
</html>
